[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "charge-window-capacity"
version = "1.0.0"
description = "Battery capacity soft sensing from 10-minute charging windows"
requires-python = ">=3.12"
authors = [{name = "Aryan Ashoori", email = "aryanashoori0@gmail.com"}]
license = "MIT"

[tool.setuptools.packages.find]
include = ["chargewin*"]

[tool.setuptools.package-data]
chargewin = ["data_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".work/pytest_cache"
